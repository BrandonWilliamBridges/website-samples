<!doctype html>
<html lang="en">
<head><script src="/website-samples/fruit-city-crm-demo/samples-sandbox.js" data-samples-sandbox></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fruit City CRM (demo)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a1f;--muted:#5f6b61;--line:#dfe4dc;--brand:#2f7d32;--brand-ink:#fff;--accent:#e8f3e8;--warn:#b45309;--danger:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#121613;--card:#1b211c;--ink:#e6ece6;--muted:#9aa79c;--line:#2c352d;--brand:#5cb860;--brand-ink:#0d130e;--accent:#203124;--warn:#f59e0b;--danger:#f87171}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000;flex-wrap:wrap}
header h1{font-size:17px;margin:0;color:var(--brand);white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav button{background:none;border:0;padding:7px 11px;border-radius:8px;color:var(--muted);font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--accent);color:var(--ink);font-weight:600}
.me{color:var(--muted);font-size:13px;white-space:nowrap}
.me a{color:var(--muted)}
@media (max-width:760px){nav{order:3;flex-basis:100%}.me{margin-left:auto}}
main{max-width:1200px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0 auto 0 0;font-size:20px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
.bar input,.bar select{width:auto;min-width:0}
.bar input[type=search]{flex:1;min-width:160px;max-width:320px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--accent);color:var(--ink)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat b{display:block;font-size:26px}
.stat span{color:var(--muted);font-size:13px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--card)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent)}
td.wrap{max-width:360px;white-space:pre-wrap}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--accent);font-size:12px}
.overdue{color:var(--warn);font-weight:600}
.empty{color:var(--muted);padding:24px;text-align:center}
.stub{font-size:11px;color:var(--warn);margin-left:4px}
#map{height:calc(100vh - 210px);min-height:380px;border-radius:12px;border:1px solid var(--line)}
.split{display:grid;grid-template-columns:1fr 340px;gap:12px}
@media (max-width:860px){.split{grid-template-columns:1fr}#map{height:55vh}}
.results{max-height:calc(100vh - 330px);overflow:auto;margin-top:8px}
.results label{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:flex-start}
.results label input{width:auto;margin-top:3px}
.results small{color:var(--muted);display:block}
dialog{border:0;border-radius:14px;padding:0;width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dhead{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.dhead h3{margin:0;flex:1;font-size:18px}
.dbody{padding:16px}
form .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
form .full{grid-column:1/-1}
@media (max-width:560px){form .fields{grid-template-columns:1fr}}
form label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
form label.check{flex-direction:row;align-items:center;gap:8px}
form label.check input{width:auto}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions .grow{flex:1}
.section{margin-top:20px}
.section h4{margin:0 0 8px;display:flex;align-items:center;gap:8px}
.section h4 .btn{margin-left:auto;padding:5px 10px;font-size:13px}
.mini{font-size:14px;border-bottom:1px solid var(--line);padding:8px 0;cursor:pointer}
.mini small{color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:3000;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hint{color:var(--muted);font-size:13px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer}
.drop.over,dialog.over .drop{border-color:var(--brand);background:var(--accent);color:var(--ink)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.thumbs:empty{display:none}
.thumb{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:var(--accent);cursor:pointer;color:var(--muted);font-size:28px}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:auto auto 6px 6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 6px;border-radius:99px}
.thumb .prog{position:absolute;inset:auto 6px 6px 6px;height:5px;background:rgba(0,0,0,.35);border-radius:3px}
.thumb .prog i{display:block;height:100%;width:0;background:var(--brand);border-radius:3px;transition:width .15s}
.thumb.busy img,.thumb.busy video{opacity:.5}
#viewer{width:min(1000px,calc(100vw - 32px))}
#viewer .stage{background:#000;display:grid;place-items:center;min-height:200px}
#viewer .stage img,#viewer .stage video{max-width:100%;max-height:calc(100vh - 190px);display:block}
#viewer .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px}
#viewer .meta .hint{flex:1;min-width:160px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="demo.js"></script>
<style>.demo-banner{background:#fff4c2;color:#5a4500;padding:8px 14px;font:14px/1.4 system-ui,sans-serif;text-align:center;border-bottom:1px solid #e6d58a}</style>

</head>
<body>
<div class="demo-banner"><b>Demo copy.</b> Every record here is made up, and nothing is saved. Reload the page to start over.</div>
<header>
  <h1>🍊 Fruit City CRM</h1>
  <nav id="nav"></nav>
  <span class="me"><span id="me"></span> · <a href="./" title="Reloads the demo with fresh sample data">reset demo</a></span>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<dialog id="dlg2" style="width:min(480px,calc(100vw - 32px))"></dialog>
<dialog id="viewer"></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toLocaleDateString('en-CA');
let SCHEMA = {}, refCache = {}, view = 'dashboard', mapObj = null;
let ME = { username: '', role: 'member' };

async function api(path, opts = {}) {
  const r = await fetch('/api/' + path, { headers: { 'content-type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { location.reload(); throw new Error('Signed out'); }
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function fmt(f, row) {
  const v = row[f.name];
  if (f.type === 'ref') return esc(row[f.name + '__label'] || '');
  if (v == null || v === '') return '';
  if (f.name === 'amount') return '$' + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2 });
  if (f.type === 'select') return `<span class="pill">${esc(v)}</span>`;
  if (f.name === 'follow_up_date' && !row.follow_up_done && v < today()) return `<span class="overdue">${esc(v)}</span>`;
  if (f.name === 'follow_up_date' && row.follow_up_done) return `<s>${esc(v)}</s>`;
  return esc(v);
}
function rowTitle(table, r) {
  if (table === 'contacts') return [r.first_name, r.last_name].filter(Boolean).join(' ');
  if (table === 'interactions') return `${r.kind || 'Interaction'} · ${r.date || ''}`;
  if (table === 'donations') return `Donation ${r.amount != null ? '$' + r.amount : ''}`;
  return r.name || SCHEMA[table].singular;
}

// ---------- nav ----------
const VIEWS = [['dashboard', 'Dashboard'], ['map', 'Map'], ['organizations'], ['contacts'], ['interactions'], ['donations'], ['grants']];
function renderNav() {
  $('#nav').innerHTML = (ME.role === 'admin' ? [...VIEWS, ['users', 'Users']] : VIEWS).map(([k, l]) => `<button data-v="${k}" class="${view === k ? 'on' : ''}">${l || SCHEMA[k].label}${SCHEMA[k]?.stub ? '<span class="stub">stub</span>' : ''}</button>`).join('');
  $('#nav').onclick = (e) => { const b = e.target.closest('button'); if (b) go(b.dataset.v); };
}
function go(v) { view = v; location.hash = v; renderNav(); render(); }

async function render() {
  const m = $('#main');
  if (mapObj) { mapObj.remove(); mapObj = null; }
  if (view === 'dashboard') return renderDashboard(m);
  if (view === 'map') return renderMap(m);
  if (view === 'users') return renderUsers(m);
  return renderList(m, view);
}

// ---------- dashboard ----------
async function renderDashboard(m) {
  m.innerHTML = '<div class="empty">Loading…</div>';
  const d = await api('dashboard');
  const stat = (k) => `<div class="card stat" style="cursor:pointer" onclick="go('${k}')"><b>${d.counts[k]}</b><span>${SCHEMA[k].label}</span></div>`;
  const item = (r) => `<div class="mini" onclick="openRecord('interactions',${r.id})"><b>${esc(r.follow_up_date || r.date || '')}</b> · ${esc(r.kind)} — ${esc(r.contact_id__label || r.org_id__label || '')}<br><small>${esc((r.summary || '').slice(0, 140))}</small></div>`;
  m.innerHTML = `
    <div class="bar"><h2>Dashboard</h2>
      <button class="btn ghost" onclick="openRecord('organizations')">+ Organization</button>
      <button class="btn ghost" onclick="openRecord('contacts')">+ Contact</button>
      <button class="btn" onclick="openRecord('interactions')">+ Log interaction</button></div>
    <div class="grid">${Object.keys(SCHEMA).map(stat).join('')}</div>
    <div class="grid" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <div class="card"><h4 style="margin:0 0 6px">Open follow-ups</h4>${d.followUps.map(item).join('') || '<div class="hint">Nothing pending.</div>'}</div>
      <div class="card"><h4 style="margin:0 0 6px">Recent interactions</h4>${d.recent.map(item).join('') || '<div class="hint">No interactions logged yet.</div>'}</div>
      <div class="card"><h4 style="margin:0 0 6px">Organizations by type</h4>${d.byType.map((t) => `<div class="mini" onclick="listFilter='${esc(t.type)}';go('organizations')">${esc(t.type || '—')} <b style="float:right">${t.n}</b></div>`).join('') || '<div class="hint">None yet — try Map → Discover nearby.</div>'}</div>
    </div>`;
}

// ---------- OpenStreetMap helpers (run in the browser; the server is the fallback) ----------
async function fetchWithTimeout(url, opts = {}, ms = 15000) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { ...opts, signal: c.signal }); } finally { clearTimeout(t); }
}
async function geocodeInBrowser({ address, city, state, zip }) {
  const q = [address, city, state, zip].filter(Boolean).join(', ');
  if (!q) return null;
  try {
    const r = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=${encodeURIComponent(q)}`, {}, 10000);
    if (!r.ok) return null;
    const h = await r.json();
    return h.length ? { lat: Number(h[0].lat), lng: Number(h[0].lon), display: h[0].display_name } : null;
  } catch (e) { return null; }
}

// ---------- lists ----------
const tagPills = (r) => [...new Set([r.auto_tags, r.tags].filter(Boolean).join(',').split(',').map((t) => t.trim().toLowerCase()).filter(Boolean))]
  .slice(0, 6).map((t) => `<span class="pill">${esc(t)}</span>`).join(' ');
let listFilter = '';
async function renderList(m, table) {
  const def = SCHEMA[table];
  const cols = def.fields.filter((f) => f.list);
  const typeFilter = table === 'organizations'
    ? `<select id="ftype"><option value="">All types</option>${def.fields.find((f) => f.name === 'type').options.map((o) => `<option ${o === listFilter ? 'selected' : ''}>${o}</option>`).join('')}</select>` : '';
  m.innerHTML = `<div class="bar"><h2>${def.label}${def.stub ? '<span class="stub">stub — fields will grow</span>' : ''}</h2>
    <input type="search" id="q" placeholder="Search ${def.label.toLowerCase()}…">${typeFilter}
    <button class="btn" id="new">+ New</button></div><div id="tbl"><div class="empty">Loading…</div></div>`;
  $('#new').onclick = () => openRecord(table);
  const load = async () => {
    const p = new URLSearchParams({ q: $('#q').value });
    if ($('#ftype')?.value) p.set('type', $('#ftype').value);
    const rows = await api(`${table}?${p}`);
    $('#tbl').innerHTML = rows.length ? `<div class="tablewrap"><table><thead><tr>${cols.map((c) => `<th>${esc(c.label)}</th>`).join('')}${def.tagged ? '<th>Tags</th>' : ''}${table === 'organizations' ? '<th>Contacts</th>' : ''}</tr></thead>
      <tbody>${rows.map((r) => `<tr data-id="${r.id}">${cols.map((c) => `<td class="${c.type === 'textarea' ? 'wrap' : ''}">${fmt(c, r)}</td>`).join('')}${def.tagged ? `<td class="wrap">${tagPills(r)}</td>` : ''}${table === 'organizations' ? `<td>${r.contact_count || ''}</td>` : ''}</tr>`).join('')}</tbody></table></div>
      <p class="hint">${rows.length} record${rows.length === 1 ? '' : 's'}</p>`
      : `<div class="card empty">No ${def.label.toLowerCase()} yet.</div>`;
    $('#tbl tbody')?.addEventListener('click', (e) => { const tr = e.target.closest('tr'); if (tr) openRecord(table, Number(tr.dataset.id)); });
  };
  let t; $('#q').oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
  if ($('#ftype')) $('#ftype').onchange = () => { listFilter = $('#ftype').value; load(); };
  load();
}

// ---------- record dialog ----------
async function refOptions(table) {
  if (!refCache[table]) refCache[table] = await api(`${table}?limit=2000`);
  return refCache[table];
}
async function openRecord(table, id, preset = {}) {
  const def = SCHEMA[table];
  const row = id ? await api(`${table}/${id}`) : { ...preset };
  const dlg = $('#dlg');
  const refs = {};
  for (const f of def.fields.filter((f) => f.type === 'ref')) refs[f.ref] = await refOptions(f.ref);
  // A select with an "other" option gets a text box for typing a custom value
  const selectHtml = (f, opts, v) => {
    const hasOther = opts.includes('other');
    const custom = v != null && v !== '' && !opts.includes(v);
    const sel = custom ? 'other' : v;
    return `<select name="${f.name}" data-sel="${f.name}"><option value="">—</option>${opts.map((o) => `<option ${o === sel ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>` +
      (hasOther ? `<input name="${f.name}__other" placeholder="Type it in" value="${custom ? esc(v) : ''}" style="margin-top:6px;${sel === 'other' ? '' : 'display:none'}">` : '');
  };
  const input = (f) => {
    let v = row[f.name];
    if (v == null && !id && f.default === 'today') v = today();
    const req = f.required ? 'required' : '';
    if (f.type === 'textarea') return `<label class="full">${f.label}<textarea name="${f.name}">${esc(v)}</textarea></label>`;
    if (f.type === 'checkbox') return `<label class="check"><input type="checkbox" name="${f.name}" ${v ? 'checked' : ''}> ${f.label}</label>`;
    if (f.type === 'select' && f.optionsMap) {
      const opts = f.optionsMap[row[f.dependsOn]] || ['other'];
      return `<label data-dep="${f.name}">${f.label}<span data-depbox="${f.name}">${selectHtml(f, opts, v)}</span></label>`;
    }
    if (f.type === 'select') return `<label>${f.label}${selectHtml(f, f.options, v)}</label>`;
    if (f.type === 'ref') return `<label>${f.label}<select name="${f.name}"><option value="">—</option>${f.allowNew ? '<option value="__new">+ Add new organization…</option>' : ''}${refs[f.ref].map((r) => `<option value="${r.id}" ${r.id === v ? 'selected' : ''}>${esc(rowTitle(f.ref, r))}${f.ref === 'contacts' && r.org_id__label ? ' (' + esc(r.org_id__label) + ')' : ''}</option>`).join('')}</select></label>`;
    return `<label data-f="${f.name}">${f.label}<input type="${f.type}" name="${f.name}" value="${esc(v)}" ${f.step ? `step="${f.step}"` : ''} ${req}></label>`;
  };
  dlg.innerHTML = `<div class="dhead"><h3>${id ? esc(rowTitle(table, row)) : 'New ' + def.singular.toLowerCase()}</h3><button class="btn ghost" id="addmedia" title="Add photos or videos">📷 +</button><button class="btn ghost" id="x">✕</button></div>
    <div class="dbody"><form id="f"><div class="fields">${def.fields.map(input).join('')}</div>
      ${def.tagged ? `<p class="hint">Auto tags: ${row.auto_tags ? row.auto_tags.split(',').map((t) => `<span class="pill">${esc(t.trim())}</span>`).join(' ') : 'added when you save'}</p>` : ''}
      ${table === 'organizations' ? `<p class="hint"><span id="geo">${row.lat ? `📍 ${row.lat.toFixed(5)}, ${row.lng.toFixed(5)}` : '📍 Located automatically from the address.'}</span> <button type="button" class="btn ghost" id="locate" style="padding:4px 10px;font-size:13px">Locate now</button></p>` : ''}
      <div class="section" id="media"></div>
      <div class="actions"><button class="btn" type="submit">Save</button>
        ${id && ME.role === 'admin' ? `<span class="grow"></span><button class="btn danger" type="button" id="del">Delete</button>` : ''}</div></form>
      <div id="rel"></div></div>`;
  dlg.showModal();
  $('#x').onclick = () => dlg.close();
  const form = $('#f');
  const media = mediaSection($('#media'), table, id);
  $('#addmedia').onclick = () => { $('#media').scrollIntoView({ behavior: 'smooth', block: 'center' }); media.pick(); };
  const syncOther = () => form.querySelectorAll('[data-sel]').forEach((s) => {
    const o = form.elements[s.name + '__other'];
    if (o) o.style.display = s.value === 'other' ? '' : 'none';
  });
  // Dependent selects (denomination follows type)
  const syncDeps = () => def.fields.filter((f) => f.optionsMap).forEach((f) => {
    const parent = form.elements[f.dependsOn];
    const pv = parent.value === 'other' ? '' : parent.value;
    const opts = f.optionsMap[pv];
    const box = form.querySelector(`[data-depbox="${f.name}"]`);
    form.querySelector(`[data-dep="${f.name}"]`).style.display = opts ? '' : 'none';
    if (opts && box.dataset.for !== pv) {
      const cur = box.dataset.for === undefined ? row[f.name] : '';
      box.innerHTML = selectHtml(f, opts, cur);
      box.dataset.for = pv;
    }
    if (!opts) box.dataset.for = '';
  });
  form.addEventListener('change', (e) => {
    if (e.target.value === '__new') return addOrgInline(e.target);
    syncDeps(); syncOther();
  });
  syncDeps(); syncOther();

  const locate = async (quiet) => {
    const fd = Object.fromEntries(new FormData(form));
    if (!fd.address && !fd.city && !fd.zip) return;
    try {
      if ($('#locate')) $('#locate').disabled = true;
      const g = (await geocodeInBrowser(fd)) || (await api('geocode', { method: 'POST', body: fd }));
      form.lat.value = g.lat; form.lng.value = g.lng;
      $('#geo').textContent = `📍 ${g.display}`;
    } catch (e) { if (!quiet) toast(e.message); else $('#geo').textContent = "📍 Couldn't find that address yet. Check it, or type the coordinates."; }
    finally { if ($('#locate')) $('#locate').disabled = false; }
  };
  if ($('#locate')) {
    $('#locate').onclick = () => locate(false);
    let gt;
    def.fields.filter((f) => f.geo).forEach((f) => form.elements[f.name].addEventListener('input', () => { clearTimeout(gt); gt = setTimeout(() => locate(true), 1200); }));
  }
  form.onsubmit = async (e) => {
    e.preventDefault();
    const body = {};
    def.fields.forEach((f) => {
      const el = form.elements[f.name];
      if (!el) return;
      if (f.type === 'checkbox') return (body[f.name] = el.checked);
      if (f.optionsMap && form.querySelector(`[data-dep="${f.name}"]`).style.display === 'none') return (body[f.name] = '');
      body[f.name] = el.value === 'other' && form.elements[f.name + '__other'] ? form.elements[f.name + '__other'].value.trim() || 'other' : el.value;
      if (body[f.name] === '__new') body[f.name] = '';
    });
    try {
      const r = await api(id ? `${table}/${id}` : table, { method: id ? 'PUT' : 'POST', body });
      delete refCache[table];
      if (!id && media.pending()) { toast('Saved — uploading photos & videos…'); await media.upload(r.id); }
      toast('Saved'); dlg.close();
      if (!id && (table === 'organizations' || table === 'contacts')) return openRecord(table, r.id);
      render();
    } catch (err) { toast(err.message); }
  };
  if ($('#del')) $('#del').onclick = async () => {
    if (!confirm('Delete this ' + def.singular.toLowerCase() + '?')) return;
    await api(`${table}/${id}`, { method: 'DELETE' }); delete refCache[table]; dlg.close(); toast('Deleted'); render();
  };
  if (id && (table === 'organizations' || table === 'contacts')) {
    const key = table === 'organizations' ? 'org_id' : 'contact_id';
    const rel = await api(`related?${key}=${id}`);
    const preset = table === 'organizations' ? { org_id: id } : { contact_id: id, org_id: row.org_id };
    $('#rel').innerHTML = `
      ${table === 'organizations' ? `<div class="section"><h4>Contacts <button class="btn ghost" id="addc">+ Add contact</button></h4>
        ${rel.contacts.map((c) => `<div class="mini" onclick="openRecord('contacts',${c.id})"><b>${esc(c.first_name)} ${esc(c.last_name)}</b> <small>${esc(c.role || '')} ${esc(c.email || '')} ${esc(c.phone || '')}</small></div>`).join('') || '<div class="hint">No contacts yet.</div>'}</div>` : ''}
      <div class="section"><h4>Interactions <button class="btn" id="addi">+ Log interaction</button></h4>
        ${rel.interactions.map((i) => `<div class="mini" onclick="openRecord('interactions',${i.id})"><b>${esc(i.date || '')}</b> · ${esc(i.kind)}${i.contact_id__label ? ' · ' + esc(i.contact_id__label) : ''}${i.follow_up_date && !i.follow_up_done ? ` · <span class="${i.follow_up_date < today() ? 'overdue' : ''}">follow up ${esc(i.follow_up_date)}</span>` : ''}<br><small>${esc(i.summary || '')}</small></div>`).join('') || '<div class="hint">Nothing logged yet.</div>'}</div>`;
    if ($('#addc')) $('#addc').onclick = () => openRecord('contacts', null, { org_id: id });
    $('#addi').onclick = () => openRecord('interactions', null, preset);
  }
  if (id && table === 'contacts') {
    const links = await api(`linked?contact_id=${id}`);
    if (links.length) $('#rel').insertAdjacentHTML('afterbegin', `<div class="section"><h4>🔗 Linked contacts</h4>
      <p class="hint" style="margin:0 0 6px">These share an email or phone number with this contact, so they're probably related.</p>
      ${links.map((c) => `<div class="mini" onclick="openRecord('contacts',${c.id})"><b>${esc(c.first_name)} ${esc(c.last_name || '')}</b> <small>same ${c.shared.join(' & ')}${c.org_id__label ? ' · ' + esc(c.org_id__label) : ''}${ME.role === 'admin' && c.created_by ? ' · added by ' + esc(c.created_by) : ''}</small></div>`).join('')}</div>`);
  }
}

// ---------- photos & videos ----------
const MAX_MB = 100;
const isVideo = (t) => /^video\//.test(t || '');
const fileSize = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
// XHR rather than fetch so we can show upload progress
function uploadFile(table, id, file, onProgress) {
  if (window.__crmDemoUpload) return window.__crmDemoUpload(table, id, file, onProgress);
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('POST', `/api/attachments?${new URLSearchParams({ table, id, name: file.name || 'pasted image' })}`);
    x.setRequestHeader('content-type', file.type);
    x.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded / e.total);
    x.onload = () => {
      let d = {};
      try { d = JSON.parse(x.responseText); } catch (e) { /* not json */ }
      if (x.status === 401) location.reload();
      x.status < 300 ? resolve(d) : reject(new Error(d.error || `Upload failed (${x.status})`));
    };
    x.onerror = () => reject(new Error('Upload failed. Check your connection and try again.'));
    x.send(file);
  });
}

// The "Photos & videos" box in a record dialog. Add files with the button, by dropping them anywhere
// on the dialog, or by pasting a screenshot. On a new record they wait and upload right after Save.
function mediaSection(box, table, id) {
  const dlg = box.closest('dialog');
  let items = [], seq = 0;
  box.innerHTML = `<h4>📷 Photos & videos <label class="btn ghost">+ Add<input type="file" accept="image/*,video/*" multiple hidden></label></h4>
    <div class="drop">Drop photos or videos here, paste a screenshot, or click to choose${id ? '' : '. They upload when you save.'}</div>
    <div class="thumbs"></div>`;
  const thumbs = $('.thumbs', box), picker = $('input[type=file]', box);
  const tile = (it) => `<button type="button" class="thumb ${it.file ? 'busy' : ''}" data-k="${it.k}" title="${esc(it.filename)}">
    ${isVideo(it.content_type) ? `<video src="${esc(it.url)}#t=0.1" preload="metadata" muted playsinline></video><span class="play">▶ video</span>`
      : `<img src="${esc(it.url)}" alt="${esc(it.filename)}" loading="lazy" onerror="this.replaceWith('🖼️')">`}
    ${it.file && id ? `<span class="prog"><i style="width:${Math.round((it.p || 0) * 100)}%"></i></span>` : ''}</button>`;
  const draw = () => { thumbs.innerHTML = items.map(tile).join(''); };
  const upload = async (rid) => {
    id = rid;
    draw();
    await Promise.all(items.filter((it) => it.file && !it.sending).map(async (it) => {
      it.sending = true;
      const bar = () => thumbs.querySelector(`[data-k="${it.k}"] .prog i`);
      try {
        const saved = await uploadFile(table, rid, it.file, (p) => { it.p = p; if (bar()) bar().style.width = Math.round(p * 100) + '%'; });
        URL.revokeObjectURL(it.url);
        Object.assign(it, saved, { file: null });
      } catch (e) { toast(`${it.filename}: ${e.message}`); items = items.filter((x) => x !== it); }
    }));
    draw();
  };
  const add = (files) => {
    let n = 0;
    for (const file of files) {
      if (!/^(image|video)\//.test(file.type)) { toast(`${file.name || 'That file'} isn't a photo or video`); continue; }
      if (file.size > MAX_MB * 1048576) { toast(`${file.name} is over ${MAX_MB} MB. Trim or compress it first.`); continue; }
      items.push({ k: ++seq, url: URL.createObjectURL(file), content_type: file.type, filename: file.name || 'pasted image', size: file.size, file });
      n++;
    }
    if (!n) return;
    id ? upload(id) : draw();
  };
  picker.onchange = () => { add(picker.files); picker.value = ''; };
  $('.drop', box).onclick = () => picker.click();
  thumbs.onclick = (e) => {
    const b = e.target.closest('.thumb');
    if (b) viewMedia(items, items.findIndex((it) => it.k === Number(b.dataset.k)), (it) => { items = items.filter((x) => x !== it); draw(); });
  };
  const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
  dlg.ondragover = (e) => { if (hasFiles(e)) { e.preventDefault(); dlg.classList.add('over'); } };
  dlg.ondragleave = (e) => { if (!dlg.contains(e.relatedTarget)) dlg.classList.remove('over'); };
  dlg.ondrop = (e) => { if (hasFiles(e)) { e.preventDefault(); dlg.classList.remove('over'); add(e.dataTransfer.files); } };
  dlg.onpaste = (e) => { if (e.clipboardData?.files.length) { e.preventDefault(); add(e.clipboardData.files); } };
  dlg.addEventListener('close', () => { dlg.ondragover = dlg.ondragleave = dlg.ondrop = dlg.onpaste = null; }, { once: true });
  if (id) api(`attachments?table=${table}&id=${id}`).then((rows) => { items = rows.map((r) => ({ ...r, k: ++seq })).concat(items); draw(); })
    .catch((e) => { $('.drop', box).textContent = e.message; });
  return { pending: () => items.some((it) => it.file), upload, pick: () => picker.click() };
}

// Full-size viewer with previous / next, download and remove
function viewMedia(items, i, onRemoved) {
  const v = $('#viewer');
  const show = () => {
    const it = items[i];
    if (!it) return v.close();
    const canRemove = it.id && (ME.role === 'admin' || it.created_by === ME.username);
    v.innerHTML = `<div class="dhead"><h3 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.filename)}</h3>
        ${items.length > 1 ? `<button class="btn ghost" data-go="-1" title="Previous">‹</button><span class="hint">${i + 1} / ${items.length}</span><button class="btn ghost" data-go="1" title="Next">›</button>` : ''}
        <button class="btn ghost" data-close>✕</button></div>
      <div class="stage">${isVideo(it.content_type) ? `<video src="${esc(it.url)}" controls autoplay playsinline></video>` : `<img src="${esc(it.url)}" alt="${esc(it.filename)}">`}</div>
      <div class="meta"><span class="hint">${it.size ? fileSize(it.size) : ''}${it.created_by ? ' · added by ' + esc(it.created_by) : ''}${it.created_at ? ' · ' + esc(it.created_at.slice(0, 10)) : ''}${it.file ? ' · not uploaded yet' : ''}</span>
        ${it.id ? `<a class="btn ghost" href="${esc(it.url)}?download" download>Download</a>` : ''}
        ${canRemove ? '<button class="btn danger" data-remove>Remove</button>' : ''}</div>`;
  };
  v.onclick = async (e) => {
    if (e.target === v || e.target.closest('[data-close]')) return v.close();
    const g = e.target.closest('[data-go]');
    if (g) { i = (i + Number(g.dataset.go) + items.length) % items.length; return show(); }
    if (e.target.closest('[data-remove]')) {
      if (!confirm('Remove this ' + (isVideo(items[i].content_type) ? 'video' : 'photo') + '?')) return;
      try {
        const it = items[i];
        await api(`attachments/${it.id}`, { method: 'DELETE' });
        items.splice(i, 1); onRemoved(it); toast('Removed');
        i = Math.min(i, items.length - 1);
        items.length ? show() : v.close();
      } catch (x) { toast(x.message); }
    }
  };
  v.onkeydown = (e) => { if (items.length > 1 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { i = (i + (e.key === 'ArrowLeft' ? -1 : 1) + items.length) % items.length; show(); } };
  v.onclose = () => { v.innerHTML = ''; }; // stops a playing video
  show();
  v.showModal();
}

// ---------- map + discover ----------
const COLORS = { church: '#7c3aed', mosque: '#0d9488', synagogue: '#1d4ed8', 'hindu temple': '#ea580c', 'buddhist temple': '#ca8a04', gurdwara: '#be185d', 'community center': '#65a30d', nonprofit: '#2f7d32', business: '#2563eb', school: '#d97706', government: '#475569', foundation: '#db2777', other: '#6b7280' };
async function renderMap(m) {
  m.innerHTML = `<div class="split"><div><div id="map"></div><p class="hint">Organizations with a location show here. Click a pin to open it.</p></div>
    <div class="card"><h4 style="margin:0 0 4px">Discover nearby</h4>
      <p class="hint" style="margin:0 0 8px">Finds places of worship or nonprofits from OpenStreetMap around the map's center, then imports the ones you pick as prospects.</p>
      <div class="bar" style="margin:0"><select id="dk"><option value="church">Places of worship (all faiths)</option><option value="nonprofit">Nonprofits & community orgs</option></select>
      <select id="dr"><option value="2000">2 km</option><option value="5000" selected>5 km</option><option value="10000">10 km</option><option value="20000">20 km</option></select>
      <button class="btn" id="dgo">Search</button></div>
      <div class="results" id="dres"></div>
      <div class="actions" id="dact" style="display:none"><label class="check" style="font-size:13px"><input type="checkbox" id="dall"> all</label><span class="grow"></span><button class="btn" id="dimp">Import selected</button></div>
    </div></div>`;
  if (!window.L) { $('#map').innerHTML = '<div class="empty">Map library failed to load.</div>'; return; }
  // Default center: Cypress/Katy, TX
  mapObj = L.map('map').setView([29.85, -95.72], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(mapObj);
  const orgs = await api('organizations?limit=2000');
  const pts = [];
  orgs.filter((o) => o.lat != null && o.lng != null).forEach((o) => {
    pts.push([o.lat, o.lng]);
    L.circleMarker([o.lat, o.lng], { radius: 8, color: '#fff', weight: 2, fillColor: COLORS[o.type] || COLORS.other, fillOpacity: 0.9 })
      .addTo(mapObj).bindTooltip(`${esc(o.name)} (${esc(o.type)})`).on('click', () => openRecord('organizations', o.id));
  });
  if (pts.length) mapObj.fitBounds(pts, { padding: [30, 30], maxZoom: 13 });
  let found = [], layer = L.layerGroup().addTo(mapObj);
  $('#dgo').onclick = async () => {
    const c = mapObj.getCenter();
    $('#dres').innerHTML = '<div class="hint">Searching OpenStreetMap…</div>'; $('#dgo').disabled = true; layer.clearLayers();
    try {
      const qs = `lat=${c.lat}&lng=${c.lng}&radius=${$('#dr').value}&kind=${$('#dk').value}`;
      const q = await api(`osm-query?${qs}`);
      let elements = null;
      for (const m of q.mirrors) { // ask OpenStreetMap directly from this browser first
        try {
          const r = await fetchWithTimeout(m, { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(q.query) }, 30000);
          if (r.ok) { elements = (await r.json()).elements; break; }
        } catch (e) { /* try the next mirror */ }
      }
      found = elements ? await api('osm-shape', { method: 'POST', body: { elements, kind: q.kind } }) : await api(`discover?${qs}`);
      L.circle(c, { radius: Number($('#dr').value), color: '#2f7d32', weight: 1, fillOpacity: 0.04 }).addTo(layer);
      found.forEach((o) => o.lat && L.circleMarker([o.lat, o.lng], { radius: 5, color: '#999', fillOpacity: 0.6 }).addTo(layer).bindTooltip(esc(o.name)));
      $('#dres').innerHTML = found.length ? found.map((o, i) => `<label><input type="checkbox" data-i="${i}" ${o.already ? 'disabled' : ''}><span><b>${esc(o.name)}</b>${o.already ? ' <span class="pill">in CRM</span>' : ''}<small>${esc([o.denomination, o.address, o.city].filter(Boolean).join(' · ') || 'no address in OSM')}</small></span></label>`).join('') : '<div class="hint">Nothing found — try a bigger radius or move the map.</div>';
      $('#dact').style.display = found.length ? '' : 'none';
    } catch (e) { $('#dres').innerHTML = `<div class="hint">${esc(e.message)}</div>`; } finally { $('#dgo').disabled = false; }
  };
  $('#dall').onchange = (e) => $('#dres').querySelectorAll('input:not(:disabled)').forEach((x) => (x.checked = e.target.checked));
  $('#dimp').onclick = async () => {
    const items = [...$('#dres').querySelectorAll('input:checked')].map((x) => found[x.dataset.i]);
    if (!items.length) return toast('Pick at least one');
    const r = await api('import-osm', { method: 'POST', body: { items } });
    delete refCache.organizations; toast(`Imported ${r.imported}`); render();
  };
}

// ---------- users (admins) ----------
async function renderUsers(m) {
  m.innerHTML = `<div class="bar"><h2>Users</h2><button class="btn" id="newu">+ Add user</button></div><div id="ul"><div class="empty">Loading…</div></div>
    <p class="hint">People sign in with a code sent to their email. Admins can delete records and manage users; members can view, add and edit records.</p>
    <p class="hint">New emails also need to be added to the sign-in list in Cloudflare (ask Claude or do it in Zero Trust → Access → Applications → Fruit City CRM).</p>`;
  const load = async () => {
    const us = await api('users');
    $('#ul').innerHTML = `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Added</th><th></th></tr></thead><tbody>${us.map((u) => {
      const self = u.username === ME.username;
      return `<tr data-id="${u.id}" data-u="${esc(u.username)}" style="cursor:default"><td><b>${esc(u.username)}</b>${self ? ' <span class="pill">you</span>' : ''}</td>
        <td><input data-email type="email" value="${esc(u.email || '')}" placeholder="add email" ${self ? 'disabled' : ''} style="min-width:200px"></td>
        <td><select data-role ${self ? 'disabled' : ''} style="width:auto"><option value="member" ${u.role !== 'admin' ? 'selected' : ''}>member</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option></select></td>
        <td>${esc((u.created_at || '').slice(0, 10))}</td>
        <td>${self ? '' : '<button class="btn danger" data-remove>Remove</button>'}</td></tr>`;
    }).join('')}</tbody></table></div>`;
  };
  $('#ul').onchange = async (e) => {
    const tr = e.target.closest('tr');
    try {
      if (e.target.matches('[data-email]')) { await api(`users/${tr.dataset.id}`, { method: 'PUT', body: { email: e.target.value } }); toast('Email saved'); }
      if (e.target.matches('[data-role]')) { await api(`users/${tr.dataset.id}`, { method: 'PUT', body: { role: e.target.value } }); toast('Role updated'); }
    } catch (x) { toast(x.message); load(); }
  };
  $('#ul').onclick = async (e) => {
    const tr = e.target.closest('tr');
    if (!tr || !e.target.matches('[data-remove]')) return;
    if (!confirm(`Remove ${tr.dataset.u}? They will no longer be able to sign in.`)) return;
    try { await api(`users/${tr.dataset.id}`, { method: 'DELETE' }); toast('Removed'); load(); } catch (x) { toast(x.message); }
  };
  $('#newu').onclick = () => {
    const dlg = $('#dlg');
    dlg.innerHTML = `<div class="dhead"><h3>Add user</h3><button class="btn ghost" id="x">✕</button></div><div class="dbody"><form id="uf"><div class="fields">
      <label>Name<input name="username" autocapitalize="none" required></label>
      <label>Role<select name="role"><option>member</option><option>admin</option></select></label>
      <label class="full">Email<input name="email" type="email" required></label>
      </div><div class="actions"><button class="btn">Add</button></div></form></div>`;
    dlg.showModal();
    $('#x').onclick = () => dlg.close();
    $('#uf').onsubmit = async (e) => {
      e.preventDefault();
      try { await api('users', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }); dlg.close(); toast('User added'); load(); } catch (x) { toast(x.message); }
    };
  };
  load();
}

// ---------- boot ----------
(async () => {
  try {
    [SCHEMA, ME] = await Promise.all([api('schema'), api('me')]);
    $('#me').textContent = ME.username + (ME.role === 'admin' ? ' (admin)' : '');
    const h = location.hash.slice(1);
    view = (VIEWS.some(([k]) => k === h) || (h === 'users' && ME.role === 'admin')) ? h : 'dashboard';
    renderNav(); render();
  } catch (e) { $('#main').innerHTML = `<div class="card empty">Couldn't load: ${esc(e.message)}</div>`; }

window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== view && (VIEWS.some(([k]) => k === h) || (h === 'users' && ME.role === 'admin'))) { view = h; renderNav(); render(); } });
</script>
